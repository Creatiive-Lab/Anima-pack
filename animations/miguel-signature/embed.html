<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Assinatura Miguel · CreativeZone</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{
    margin:0;
    width:100%;
    min-height:0;
    background:transparent!important;
    overflow:hidden;
  }
  body{min-height:0}
  .signature-embed{
    width:100%;
    margin:0;
    padding:0;
    background:transparent;
  }
  .stage-shell{
    width:100%;
    border-radius:0;
    background:transparent;
  }
  #scene{overflow:visible}
  .embed-hidden{
    position:absolute!important;
    width:1px!important;
    height:1px!important;
    overflow:hidden!important;
    clip:rect(0 0 0 0)!important;
    white-space:nowrap!important;
    pointer-events:none!important;
    opacity:0!important;
  }
</style>
</head>
<body>
<main class="signature-embed" aria-label="Assinatura animada Miguel CreativeZone">
  <div id="stage-shell" class="stage-shell">
    <div id="scene" aria-hidden="true">
      <div id="backglow" class="procedural backglow"></div>
      <div id="sweep" class="procedural sweep"></div>
      <div id="scanlines" class="procedural scanlines"></div>
      <div id="vignette" class="procedural vignette"></div>
    </div>
    <canvas id="fx-canvas" class="procedural fx-canvas" aria-hidden="true"></canvas>
  </div>
</main>

<div class="embed-hidden" aria-hidden="true">
  <span id="status"></span>
  <div id="layer-panel"></div>
  <button id="pause" type="button"></button>
  <button id="reset" type="button"></button>
  <button id="all-on" type="button"></button>
  <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1">
  <b id="speed-value">1.00×</b>
  <input id="parallax" type="checkbox" checked>
  <input id="glow" type="checkbox" checked>
  <input id="fx-toggle" type="checkbox" checked>
</div>

<script src="player.js"></script>
</body>
</html>
