<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beta ZONE · Founder Edition</title>
<style>
body{margin:0;background:#09090d;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center}.frame{position:relative;width:min(70vw,420px);aspect-ratio:1}.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.avatar{z-index:1;display:grid;place-items:center;font-size:80px;color:#ffdce2}.base{z-index:3;animation:pulse 5s infinite}.mascot{z-index:4}.emblem{z-index:5}.fx{z-index:6;animation:spin 6s linear infinite}.title{margin-top:20px;color:#ff405a;font-size:32px;font-weight:900}@keyframes pulse{50%{filter:brightness(1.3) drop-shadow(0 0 18px #ff405a)}}@keyframes spin{to{transform:rotate(360deg)}}button{margin-top:20px;padding:12px 20px;border-radius:10px;background:#ff304f;color:white;border:0}
</style>
</head>
<body>
<div class="wrap">
<div class="frame">
<div class="avatar">CZ</div>
<img class="base" src="assets/base-frame.webp" alt="">
<img class="mascot" src="assets/mascot.webp" alt="">
<img class="emblem" src="assets/cz-emblem.webp" alt="">
</div>
<div class="title">Beta ZONE</div>
<button onclick="location.reload()">Reiniciar</button>
</div>
</body>
</html>
